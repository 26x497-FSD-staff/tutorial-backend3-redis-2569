name: backend
services:
  redis:
    image: redis:8.6-alpine
    container_name: redis_cache
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    environment:
      - TZ=Asia/Bangkok
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  redis_data:

